<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>evalion — uma homenagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6e4df; --ink:#1e1e1d; --ink-2:#6d6b66; --line:rgba(0,0,0,.12);
  --shadow:rgba(0,0,0,.28);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#141413; --ink:#ecebe7; --ink-2:#8b8984; --line:rgba(255,255,255,.12); --shadow:rgba(0,0,0,.6); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#141413; --ink:#ecebe7; --ink-2:#8b8984; --line:rgba(255,255,255,.12); --shadow:rgba(0,0,0,.6); color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:baseline;padding:18px 24px 0;font-size:13px;letter-spacing:-.01em}
header .t{font-weight:500;font-size:15px;letter-spacing:-.03em}
header .c{color:var(--ink-2)}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;min-height:0}
.stage.drag{cursor:grabbing}
.stage{overflow:hidden}
.zoomer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:0 0;will-change:transform}
.zoomer.anim{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.stage.zoomed{cursor:move}
.zl{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink-2);background:var(--bg);padding:4px 10px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;font-variant-numeric:tabular-nums}
.stage.zoomed .zl{opacity:1}
.book-wrap{position:relative;perspective:2600px}
.book{position:relative;transform-style:preserve-3d;will-change:transform}
.ground{position:absolute;left:50%;top:0;height:100%;pointer-events:none;transform:translateZ(-2px);box-shadow:0 30px 60px -20px var(--shadow),0 8px 18px -8px var(--shadow);border-radius:1px}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fff}
.face img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.face.back{transform:rotateY(180deg)}
.face .gut{position:absolute;top:0;bottom:0;width:14%;pointer-events:none}
.face.front .gut{left:0;background:linear-gradient(to right,rgba(0,0,0,.22),rgba(0,0,0,.06) 30%,rgba(0,0,0,0))}
.face.back .gut{right:0;background:linear-gradient(to left,rgba(0,0,0,.22),rgba(0,0,0,.06) 30%,rgba(0,0,0,0))}
.face .sh{position:absolute;inset:0;pointer-events:none;opacity:0}
.face.front .sh{background:linear-gradient(to left,rgba(0,0,0,.55),rgba(0,0,0,.15) 60%,rgba(255,255,255,.08))}
.face.back .sh{background:linear-gradient(to right,rgba(0,0,0,.55),rgba(0,0,0,.15) 60%,rgba(255,255,255,.08))}
.face .gl{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}
.face.front .gl{background:linear-gradient(to right,rgba(255,255,255,0) 30%,rgba(255,255,255,.35) 55%,rgba(255,255,255,0) 80%)}
.face.back .gl{background:linear-gradient(to left,rgba(255,255,255,0) 30%,rgba(255,255,255,.35) 55%,rgba(255,255,255,0) 80%)}
.cover-edge{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
footer{padding:0 24px 18px}
.bar{display:flex;align-items:center;gap:16px;font-size:13px}
.bar button{background:none;border:0;color:var(--ink);font:inherit;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:background .2s}
.bar button:hover{background:var(--line)}
.bar button:disabled{opacity:.25;cursor:default;background:none}
.bar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}
.ind{min-width:76px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.track{flex:1;position:relative;height:36px;cursor:pointer;display:flex;align-items:center}
.track .rail{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.track .fill{position:absolute;left:0;height:1px;background:var(--ink);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.track .knob{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ink);transform:translateX(-50%);transition:left .5s cubic-bezier(.2,.8,.2,1)}
.track .tip{position:absolute;bottom:34px;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .2s;display:flex;gap:1px;box-shadow:0 10px 30px -10px var(--shadow)}
.track .tip img{height:110px;display:block}
.track:hover .tip{opacity:1}
.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink-2);transition:opacity .8s;pointer-events:none;white-space:nowrap}
.loader{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--ink-2);transition:opacity .6s}
@media (max-width:600px){header{padding:14px 16px 0}footer{padding:0 12px 12px}.track .tip{display:none}}
</style>
</head>
<body>
<div class="app">
  <header><span class="t">evalion</span><span class="c">uma homenagem · felipe ornellas · 2026</span></header>
  <div class="stage" id="stage">
    <div class="loader" id="loader">abrindo…</div>
    <div class="zoomer" id="zoomer">
      <div class="book-wrap" id="wrap" style="opacity:0">
        <div class="book" id="book"><div class="ground" id="ground"></div></div>
      </div>
    </div>
    <div class="zl" id="zl">100%</div>
    <div class="hint" id="hint">arraste ou clique para virar · duplo clique para ampliar</div>
  </div>
  <footer>
    <div class="bar">
      <button id="prev" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="ind" id="ind">capa</div>
      <div class="track" id="track"><div class="rail"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div><div class="tip" id="tip"></div></div>
      <button id="next" aria-label="Próxima página"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button id="zoom" aria-label="Ampliar"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path d="M8 10.5h5"/><path id="zplus" d="M10.5 8v5"/></svg></button>
    </div>
  </footer>
</div>
<script>
const P = 48;
const pad = n => String(n).padStart(2, '0');
const LO = Array.from({ length: P }, (_, i) => `pages/1x/p-${pad(i + 1)}.jpg`);
const HI = Array.from({ length: P }, (_, i) => `pages/2x/p-${pad(i + 1)}.jpg`);
const N = Math.ceil(P / 2);
const book = document.getElementById('book');
const ground = document.getElementById('ground');
const wrap = document.getElementById('wrap');
const stage = document.getElementById('stage');
const zoomer = document.getElementById('zoomer');
const zl = document.getElementById('zl');
const leaves = [];
let pw = 300, ph = 424;
let target = 0;

for (let i = 0; i < N; i++) {
  const el = document.createElement('div');
  el.className = 'leaf';
  el.innerHTML =
    `<div class="face front${i===0?' cover-edge':''}"><img alt="página ${2*i+1}" draggable="false" decoding="async"><div class="gut"></div><div class="sh"></div><div class="gl"></div></div>` +
    `<div class="face back${i===N-1?' cover-edge':''}"><img alt="página ${2*i+2}" draggable="false" decoding="async"><div class="gut"></div><div class="sh"></div><div class="gl"></div></div>`;
  const imgs = el.querySelectorAll('img');
  imgs[0].src = LO[2 * i]; imgs[0].dataset.p = 2 * i;
  if (2 * i + 1 < P) { imgs[1].src = LO[2 * i + 1]; imgs[1].dataset.p = 2 * i + 1; }
  book.appendChild(el);
  leaves.push({ el, angle: 0, anim: null, imgs,
    shF: el.querySelector('.front .sh'), shB: el.querySelector('.back .sh'),
    glF: el.querySelector('.front .gl'), glB: el.querySelector('.back .gl') });
}

function layout() {
  const sr = stage.getBoundingClientRect();
  const maxH = sr.height - 70, maxW = (sr.width - 40) / 2;
  ph = Math.max(160, Math.min(maxH, maxW * 1.4142));
  pw = ph / 1.4142;
  book.style.width = (pw * 2) + 'px'; book.style.height = ph + 'px';
  wrap.style.width = (pw * 2) + 'px'; wrap.style.height = ph + 'px';
  setZoom(1, 0, 0, false);
  render();
}

function easeInOut(t){ return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function render() {
  let topL = -1, topR = N;
  for (let i = 0; i < N; i++) {
    const L = leaves[i];
    if (L.anim || L.dragging) continue;
    if (L.angle >= 90) topL = Math.max(topL, i); else topR = Math.min(topR, i);
  }
  for (let i = 0; i < N; i++) {
    const L = leaves[i], a = L.angle;
    const moving = !!(L.anim || L.dragging);
    const vis = moving || i === topL || i === topR;
    L.el.style.visibility = vis ? 'visible' : 'hidden';
    const rank = a > 90 ? i : N - i;
    L.el.style.zIndex = rank + (moving ? 1000 : 0);
    const lift = Math.sin(a * Math.PI / 180);
    const dz = moving ? 1.5 + rank / N + lift * 3 : 0;
    L.el.style.transform = `translateZ(${dz}px) rotateY(${-a}deg)`;
    L.shF.style.opacity = a < 90 ? (a / 90) * 0.75 : 0;
    L.shB.style.opacity = a > 90 ? ((180 - a) / 90) * 0.75 : 0;
    L.glF.style.opacity = a < 90 ? lift * .9 : 0; L.glB.style.opacity = a > 90 ? lift * .9 : 0;
  }
  const a0 = leaves[0].angle / 180, aN = leaves[N - 1].angle / 180;
  const shift = -pw / 2 * (1 - a0) + pw / 2 * aN;
  book.style.transform = `translateX(${shift}px)`;
  const leftOn = Math.max(0, -Math.cos(leaves[0].angle*Math.PI/180)), rightOn = Math.max(0, Math.cos(leaves[N-1].angle*Math.PI/180));
  const gl = 50 - 50 * leftOn, gr = 50 + 50 * rightOn;
  ground.style.left = gl + '%'; ground.style.width = (gr - gl) + '%';
  ui();
}

function animateLeaf(i, to, dur, delay = 0) {
  const L = leaves[i];
  if (L.anim) cancelAnimationFrame(L.anim.raf);
  const from = L.angle;
  if (from === to) { L.anim = null; render(); return; }
  const d = dur * Math.max(.25, Math.abs(to - from) / 180);
  const start = performance.now() + delay;
  const step = now => {
    const t = Math.min(1, Math.max(0, (now - start) / d));
    L.angle = from + (to - from) * easeInOut(t);
    if (t < 1) { L.anim.raf = requestAnimationFrame(step); }
    else { L.angle = to; L.anim = null; }
    render();
  };
  L.anim = { raf: requestAnimationFrame(step) };
}

function goTo(n, stagger = true) {
  n = Math.max(0, Math.min(N, n));
  if (n === target) return;
  if (Z.s > 1) setZoom(1, 0, 0, true);
  const prev = target; target = n;
  let k = 0;
  if (n > prev) for (let i = prev; i < n; i++) animateLeaf(i, 180, 900, stagger ? k++ * 70 : 0);
  else for (let i = prev - 1; i >= n; i--) animateLeaf(i, 0, 900, stagger ? k++ * 70 : 0);
  hideHint(); ui();
  preloadAround(n);
}

/* ---------- zoom ---------- */
const Z = { s: 1, x: 0, y: 0 };
const ZMAX = 4;
const zoomB = document.getElementById('zoom'), zplus = document.getElementById('zplus');
function clampZ() {
  const W = stage.clientWidth, H = stage.clientHeight;
  Z.x = Math.min(0, Math.max(W * (1 - Z.s), Z.x));
  Z.y = Math.min(0, Math.max(H * (1 - Z.s), Z.y));
}
function setZoom(s, x, y, animate) {
  Z.s = Math.max(1, Math.min(ZMAX, s)); Z.x = x; Z.y = y;
  if (Z.s < 1.02) { Z.s = 1; Z.x = 0; Z.y = 0; }
  clampZ();
  zoomer.classList.toggle('anim', !!animate);
  zoomer.style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.s})`;
  const on = Z.s > 1;
  stage.classList.toggle('zoomed', on);
  zl.textContent = Math.round(Z.s * 100) + '%';
  zplus.style.display = on ? 'none' : '';
  zoomB.setAttribute('aria-label', on ? 'Reduzir' : 'Ampliar');
  if (on) upgradeVisible();
}
function zoomAt(px, py, s, animate) {
  const k = s / Z.s;
  setZoom(s, px - (px - Z.x) * k, py - (py - Z.y) * k, animate);
}
function stagePoint(e) {
  const r = stage.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function upgradeVisible() {
  leaves.forEach(L => {
    if (L.el.style.visibility === 'hidden') return;
    L.imgs.forEach(img => {
      const p = img.dataset.p;
      if (p === undefined || img.dataset.hi) return;
      img.dataset.hi = 1;
      const hi = new Image();
      hi.onload = () => { img.src = HI[p]; };
      hi.src = HI[p];
    });
  });
}
function preloadAround(n) {
  [2*n - 1, 2*n, 2*n + 1, 2*n + 2].forEach(p => { if (p >= 0 && p < P) { const im = new Image(); im.src = LO[p]; } });
}
zoomB.onclick = () => {
  if (Z.s > 1) setZoom(1, 0, 0, true);
  else zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 2.2, true);
};
stage.addEventListener('wheel', e => {
  if (!(e.ctrlKey || Z.s > 1)) return;
  e.preventDefault();
  const [px, py] = stagePoint(e);
  zoomAt(px, py, Z.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025)), false);
}, { passive: false });

/* ---------- UI ---------- */
const ind = document.getElementById('ind'), fill = document.getElementById('fill'), knob = document.getElementById('knob');
const prevB = document.getElementById('prev'), nextB = document.getElementById('next');
function label(n) {
  if (n === 0) return 'capa';
  if (n === N) return 'contracapa';
  return `${2*n} – ${2*n+1}`;
}
function ui() {
  ind.textContent = label(target);
  const p = (target / N * 100) + '%';
  fill.style.width = p; knob.style.left = p;
  prevB.disabled = target === 0; nextB.disabled = target === N;
}
prevB.onclick = () => goTo(target - 1);
nextB.onclick = () => goTo(target + 1);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goTo(target + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(target - 1); }
  if (e.key === 'Home') goTo(0);
  if (e.key === 'End') goTo(N);
  if (e.key === 'Escape' && Z.s > 1) setZoom(1, 0, 0, true);
  if ((e.key === '+' || e.key === '=') ) zoomAt(stage.clientWidth/2, stage.clientHeight/2, Z.s * 1.4, true);
  if (e.key === '-') zoomAt(stage.clientWidth/2, stage.clientHeight/2, Z.s / 1.4, true);
});

const track = document.getElementById('track'), tip = document.getElementById('tip');
function trackIndex(x) {
  const r = track.getBoundingClientRect();
  return Math.round(Math.max(0, Math.min(1, (x - r.left) / r.width)) * N);
}
track.addEventListener('click', e => goTo(trackIndex(e.clientX)));
track.addEventListener('mousemove', e => {
  const n = trackIndex(e.clientX), r = track.getBoundingClientRect();
  const pages = n === 0 ? [0] : n === N ? [P - 1] : [2*n - 1, 2*n];
  const key = pages.join(',');
  if (tip.dataset.k !== key) {
    tip.dataset.k = key;
    tip.innerHTML = pages.map(p => `<img src="${LO[p]}" alt="">`).join('');
  }
  tip.style.left = ((n / N) * r.width) + 'px';
});

/* ---------- gestos ---------- */
const ptrs = new Map();
let drag = null, pan = null, pinch = null;
let lastTap = { t: 0, x: 0, y: 0 }, tapTimer = null;

function startLeafDrag(e) {
  const r = book.getBoundingClientRect();
  const fwd = e.clientX >= r.left + r.width / 2;
  const i = fwd ? target : target - 1;
  if (i < 0 || i >= N) { drag = { none: true, x0: e.clientX, y0: e.clientY, moved: false }; return; }
  drag = { i, fwd, x0: e.clientX, y0: e.clientY, a0: leaves[i].angle, moved: false, lastX: e.clientX, lastT: performance.now(), v: 0, started: false };
}
function settleLeaf(d) {
  const L = leaves[d.i]; L.dragging = false;
  let done = L.angle > 90;
  if (d.v < -0.4) done = true; if (d.v > 0.4) done = false;
  animateLeaf(d.i, done ? 180 : 0, 700);
  target = done ? d.i + 1 : d.i;
  ui();
}

stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) {
    if (drag && drag.started) settleLeaf(drag);
    drag = null; pan = null;
    const [a, b] = [...ptrs.values()];
    pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y), s0: Z.s, x0: Z.x, y0: Z.y, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
    return;
  }
  if (ptrs.size > 2) return;
  if (Z.s > 1) pan = { x0: e.clientX, y0: e.clientY, zx: Z.x, zy: Z.y, moved: false };
  else startLeafDrag(e);
  stage.classList.add('drag');
});

stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const r = stage.getBoundingClientRect();
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    const s = Math.max(1, Math.min(ZMAX, pinch.s0 * d / pinch.d0));
    const k = s / pinch.s0;
    const px = pinch.cx - r.left, py = pinch.cy - r.top;
    setZoom(s, px - (px - pinch.x0) * k + (cx - pinch.cx), py - (py - pinch.y0) * k + (cy - pinch.cy), false);
    return;
  }
  if (pan) {
    const dx = e.clientX - pan.x0, dy = e.clientY - pan.y0;
    if (Math.hypot(dx, dy) > 4) pan.moved = true;
    setZoom(Z.s, pan.zx + dx, pan.zy + dy, false);
    return;
  }
  if (!drag || drag.none) {
    if (drag && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 4) drag.moved = true;
    return;
  }
  const dx = e.clientX - drag.x0;
  if (Math.abs(dx) > 4) drag.moved = true;
  if (!drag.moved) return;
  const L = leaves[drag.i];
  if (!drag.started) {
    drag.started = true;
    if (L.anim) { cancelAnimationFrame(L.anim.raf); L.anim = null; }
    L.dragging = true;
  }
  const now = performance.now();
  drag.v = (e.clientX - drag.lastX) / Math.max(1, now - drag.lastT);
  drag.lastX = e.clientX; drag.lastT = now;
  L.angle = Math.max(0, Math.min(180, drag.a0 - dx / (pw * 1.6) * 180));
  render(); hideHint();
});

function onTap(e) {
  const now = performance.now();
  const isDouble = now - lastTap.t < 300 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30;
  if (isDouble) {
    clearTimeout(tapTimer); tapTimer = null; lastTap.t = 0;
    const [px, py] = stagePoint(e);
    if (Z.s > 1) setZoom(1, 0, 0, true); else zoomAt(px, py, 2.5, true);
    hideHint();
    return;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
  if (Z.s > 1) return;
  const r = book.getBoundingClientRect();
  const fwd = e.clientX >= r.left + r.width / 2;
  tapTimer = setTimeout(() => { tapTimer = null; goTo(target + (fwd ? 1 : -1)); }, 260);
}

function endPointer(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (pinch) {
    if (ptrs.size < 2) {
      pinch = null;
      if (ptrs.size === 1 && Z.s > 1) { const p = [...ptrs.values()][0]; pan = { x0: p.x, y0: p.y, zx: Z.x, zy: Z.y, moved: true }; }
      if (Z.s < 1.05) setZoom(1, 0, 0, true);
    }
    if (ptrs.size === 0) stage.classList.remove('drag');
    lastTap.t = 0;
    return;
  }
  if (ptrs.size > 0) return;
  stage.classList.remove('drag');
  if (pan) { const moved = pan.moved; pan = null; if (!moved && e.type === 'pointerup') onTap(e); return; }
  if (drag) {
    const d = drag; drag = null;
    if (d.started) { settleLeaf(d); lastTap.t = 0; hideHint(); }
    else if (!d.moved && e.type === 'pointerup') onTap(e);
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('dblclick', e => e.preventDefault());

const hint = document.getElementById('hint');
let hinted = false;
